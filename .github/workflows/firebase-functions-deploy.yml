name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - functions/**
      - firebase.json
      - .firebaserc

permissions:
  contents: read

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

jobs:
  test_and_deploy:
    name: Test and deploy functions
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INVOICE_SIMPLE_336 }}
      FIREBASE_PROJECT_ID: invoice-simple-336

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Test function renderers
        working-directory: functions
        run: npm test

      - name: Verify Firebase credentials
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_INVOICE_SIMPLE_336 repository secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INVOICE_SIMPLE_336 }}

      - name: Deploy Firebase Functions
        run: npx --yes firebase-tools@13.35.1 deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
